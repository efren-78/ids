<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDS — Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-login.css">
</head>

<body>
    <div class="glow-bg"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Logo & Brand -->
            <div class="login-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                </div>
                <h1 class="brand-title">COMMAND CENTER</h1>
                <p class="brand-subtitle">Sistema de Detección de Intrusiones</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required
                            autofocus>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña"
                            required>
                    </div>
                </div>

                <!-- Error Message -->
                <div class="error-message" id="error-message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="15" y1="9" x2="9" y2="15" />
                        <line x1="9" y1="9" x2="15" y2="15" />
                    </svg>
                    <span>Credenciales incorrectas</span>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span class="btn-text">Acceder al Dashboard</span>
                    <span class="btn-loader" id="btn-loader"></span>
                </button>
            </form>

            <div class="login-footer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" width="13" height="13">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span>Conexión segura · Sesión protegida</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const errorMsg = document.getElementById('error-message');
            const btnLogin = document.getElementById('btn-login');
            const btnLoader = document.getElementById('btn-loader');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.classList.remove('visible', 'shake');

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Mostrar estado de carga
                btnLogin.classList.add('loading');
                btnLogin.disabled = true;

                try {
                    const body = `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body
                    });

                    if (res.ok) {
                        // Login exitoso — redirigir al dashboard
                        window.location.href = '/';
                    } else {
                        // Credenciales incorrectas
                        errorMsg.classList.add('visible');
                        // Trigger shake animation
                        requestAnimationFrame(() => {
                            errorMsg.classList.add('shake');
                        });

                        btnLogin.classList.remove('loading');
                        btnLogin.disabled = false;
                    }
                } catch (err) {
                    errorMsg.querySelector('span').textContent = 'Error de conexión con el servidor';
                    errorMsg.classList.add('visible');
                    requestAnimationFrame(() => {
                        errorMsg.classList.add('shake');
                    });

                    btnLogin.classList.remove('loading');
                    btnLogin.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
