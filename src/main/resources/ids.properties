# ===================================================================
# Configuración del Sistema de Detección de Intrusiones (IDS)
# ===================================================================

# --- Configuración de Captura de Red (MainIDS) ---
ids.capture.snaplen=65536
ids.capture.timeout.ms=10
ids.capture.filter=ip or ip6
ids.capture.promiscuous=true

# --- Configuración del Motor de Detección (DetectionEngine) ---
ids.engine.purge.interval.seconds=30
ids.engine.worker.count=0
ids.engine.queue.capacity=10000

# --- Detector de Escaneo de Puertos (PortScanDetector) ---
ids.detector.portscan.window.ms=10000
ids.detector.portscan.threshold=15
ids.detector.portscan.max.capacity=50000

# --- Detector de SYN Flood (SynFloodDetector) ---
ids.detector.synflood.window.ms=5000
ids.detector.synflood.threshold=50
ids.detector.synflood.max.capacity=50000

# --- Detector de Fuerza Bruta (BruteForceDetector) ---
ids.detector.bruteforce.window.ms=10000
ids.detector.bruteforce.threshold=20
ids.detector.bruteforce.max.capacity=50000
ids.detector.bruteforce.ports=21,22,23,3389,3306,5432

